# Description: Sent to the player when they try to use a vehicle command without looking at a vehicle (and they have more than one nearby vehicle).
VehicleMustBeLookingAtLinkedVehicle: <#ff8c69>你必须看向一辆载具，或者附近只拥有一辆载具。

# Description: Sent to the player when they try to use a vehicle command on a vehicle not in their group.
#  {0} - FactionInfo (Format: Colored Display Name)
VehicleNotOnSameTeam: <#ff8c69>该载具属于 {0}，而你不是该阵营。

# Description: Sent to the player when they try to use a vehicle command on a vehicle they don't own.
#  {0} - IPlayer (Format: Colored Character Name)
VehicleLinkedVehicleNotOwnedByCaller: <#ff8c69>该载具属于 {0}。

# Description: Sent to the player after /vehicle give is ran successfully.
#  {0} - VehicleAsset
#  {1} - IPlayer (Format: Colored Character Name)
VehicleGiven: <#d1bda7>已将你的 <#a0ad8e>{0}</color> 赠送给 {1}。

# Description: Sent to the player after /vehicle give is ran successfully.
#  {0} - VehicleAsset
#  {1} - IPlayer (Format: Colored Nick Name)
VehicleGivenDm: <#d1bda7>{1} 将他们的 <#a0ad8e>{0}</color> 赠送给了你。

# Description: Sent when a player tries to kick another player who isn't in the vehicle.
#  {0} - IPlayer (Format: Colored Nick Name)
VehicleTargetNotInVehicle: <#ff8c69>{0} 不在载具内。

# Description: Sent when a player tries to kick from a seat that is empty.
#  {0} - int
VehicleSeatNotOccupied: <#ff8c69>座位 <#ddd>#{0}</color> 当前无人乘坐。

# Description: Sent when a player tries to kick from a seat but the plugin can't figure out which seat to choose from their input.
#  {0} - string
VehicleSeatNotValidText: <#ff8c69>无法根据 "<#fff>{0}</color>" 选择座位。

# Description: Sent to the kicked player when a player is kicked from a vehicle.
#  {0} - VehicleAsset
#  {1} - IPlayer (Format: Colored Nick Name)
#  {2} - int
VehicleOwnerKickedDM: <#d1a8a8><#ccc>{0}</color> 的车主 {1} 将你从座位 <#ddd>#{2}</color> 踢出。

# Description: Sent to the calling player when a player is kicked from a vehicle.
#  {0} - VehicleAsset
#  {1} - IPlayer (Format: Colored Nick Name)
#  {2} - int
VehicleKickedPlayer: <#d1bda7>已将 {1} 从你的 <#ccc>{0}</color> 的座位 <#ddd>#{2}</color> 踢出。

# Description: Line on the vehicle HUD showing how many countermeasures (flares) the vehicle has left.
#  {0} - int
VehicleHUDFlareCount: 剩余热诱弹: {0}

# Description: Line on the vehicle HUD that is shown when a missile is locked onto the current aircraft. Shown for all players.
