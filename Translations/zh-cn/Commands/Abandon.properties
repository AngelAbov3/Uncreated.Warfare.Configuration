# Description: Sent when a player isn't looking at a vehicle when doing /abandon.
AbandonNoTarget: <#ff8c69>你必须看着一辆载具。

# Description: Sent when a player is looking at a vehicle they didn't request.
#  {0} - VehicleAsset
AbandonNotOwned: <#ff8c69>你没有请求该 {0}。

# Description: Sent when a player does /abandon while not in main.
AbandonNotInMain: <#ff8c69>你必须在主基地才能放弃载具。

# Description: Sent when a player tries to abandon a damaged vehicle.
#  {0} - VehicleAsset
AbandonDamaged: <#ff8c69>你的 <#cedcde>{0}</color> 已损坏，请修复后再将其归还车库。

# Description: Sent when a player tries to abandon a vehicle with low fuel.
#  {0} - VehicleAsset
AbandonNeedsFuel: <#ff8c69>你的 <#cedcde>{0}</color> 燃料未加满。

# Description: Sent when a player tries to abandon a vehicle and all the bays for that vehicle are already full, theoretically should never happen.
#  {0} - VehicleAsset
#  | Addon: Always Plural
AbandonNoSpace: <#ff8c69>车库中没有空间存放 <#cedcde>{0}</color>。

# Description: Sent when a player tries to abandon a vehicle that isn't allowed to be abandoned.
#  {0} - VehicleAsset
#  | Addon: Always Plural
AbandonNotAllowed: <#ff8c69><#cedcde>{0}</color> 无法被归还。

# Description: Sent when a player abandons a vehicle.
#  {0} - VehicleAsset
AbandonSuccess: <#a0ad8e>你的 <#cedcde>{0}</color> 已归还至车库。

# Description: Credits toast for returning a vehicle soon after requesting it.
AbandonCompensationToast: 归还载具

# Description: Credits toast for returning a vehicle soon after requesting it, but not getting anything because the vehicle was transferred.
AbandonCompensationToastTransferred: +0 <color=#b8ffc1>C</color> [已转移]\n归还载具