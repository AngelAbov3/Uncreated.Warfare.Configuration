# Description: Description of the Squadleader class.
DescriptionSquadleader: 通过提供<#f4bb57>集结点</color>并放置<#f4bb57>FOB无线电</color>来帮助你的小队。

# Description: Description of the Rifleman class.
DescriptionRifleman: 使用<#f4bb57>弹药包</color>为战场上的队友补给。

# Description: Description of the Medic class.
DescriptionMedic: 队友受伤后使用<#f4bb57>救援</color>将其恢复。

# Description: Description of the Breacher class.
DescriptionBreacher: 使用<#f4bb57>高威力爆炸物</color>摧毁<#f45a57>敌方FOB</color>。

# Description: Description of the Automatic Rifleman class.
DescriptionAutoRifleman: 装备高容量、高威力的<#f4bb57>轻机枪</color>压制敌人。

# Description: Description of the Grenadier class.
DescriptionGrenadier: 装备<#f4bb57>榴弹发射器</color>，攻击掩体后的敌人或轻型装甲车辆。

# Description: Description of the Machine Gunner class.
DescriptionMachineGunner: 装备强大的<#f4bb57>重机枪</color>撕裂敌方阵线。

# Description: Description of the Light Anti-Tank class.
DescriptionLAT: 兼具反坦克和战斗能力，用于快速摧毁<#f45a57>敌方装甲车辆</color>。

# Description: Description of the Heavy Anti-Tank class.
DescriptionHAT: 装备多枚强力<#f4bb57>反坦克炮弹</color>，摧毁各种载具。

# Description: Description of the Marksman class.
DescriptionMarksman: 装备<#f4bb57>精确射手步枪</color>，消灭中远距离敌人。

# Description: Description of the Sniper class.
DescriptionSniper: 装备高威力<#f4bb57>狙击步枪</color>，消灭远距离敌人。

# Description: Description of the Anti-Personnel Rifleman class.
DescriptionAPRifleman: 部署<#f4bb57>爆炸陷阱</color>，封锁入口并限制敌方车辆。

# Description: Description of the Combat Engineer class.
DescriptionCombatEngineer: 拥有200%的<#f4bb57>建造速度</color>，装备<#f4bb57>防御工事</color>和陷阱帮助防守队伍的FOB。

# Description: Description of the Crewman class.
DescriptionCrewman: 允许玩家操作<#f4bb57>装甲车辆</color>。

# Description: Description of the Pilot class.
DescriptionPilot: 允许玩家驾驶<#f4bb57>所有的飞行载具</color>。

# Description: Description of the Special Ops class.
DescriptionSpecOps: 装备<#f4bb57>夜视设备</color>，帮助在夜间观察。

