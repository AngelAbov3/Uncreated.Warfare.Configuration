# Description: Window title.
Title: 选项

# Description: Title of the language, culture, and time zone section.
InternationalizationTitle: 国际化设置

# Description: Placeholder text for the language search text box.
PlaceholderLanguageName: 语言名称

# Description: Placeholder text for the culture search text box.
PlaceholderCulture: 国际区域设置

# Description: Placeholder text for the time zone search text box.
PlaceholderTimeZone: 时区

# Description: Button text for all the search buttons.
ButtonSearch: 搜索

# Description: Button text for all the apply (select) buttons.
ButtonApply: 应用

# Description: Button text for the save button.
ButtonSave: 保存

# Description: Button text for the cancel button.
ButtonCancel: 取消

# Description: Text displayed when there are no results from a language search.
NoResultsLanguage: 未找到支持的语言。\n如果你想参与翻译包贡献，\n请在 /discord 中联系 <#aaa>@BlazingFlame</color>。

# Description: Text displayed when there are no results from a culture search.
NoResultsCulture: 未找到区域设置，请尝试搜索国家名称。\n你也可以输入任意 RFC-4646 区域代码。

# Description: Text displayed when there are no results from a time zone search.
NoResultsTimeZone: 未找到时区。\n你也可以输入任意 IANA 时区 ID。

# Description: Format for extra information about a language when it's the selected language.
#  {0} - string | Internal language code (es-es, etc)
#  {1} - float (Format: "P0") | Support/implementation percentage
LanguageInfoFormatSelected: <#0f0>已选择</color> <#444>|</color> {0} <#444>|</color> 支持度: <#fff>{1}

# Description: Format for extra information about a language when it's not the selected language.
#  {0} - string | Internal language code (es-es, etc)
#  {1} - float (Format: "P0") | Support/implementation percentage
LanguageInfoFormatDeselected: {0} <#444>|</color> 支持度: <#fff>{1}

# Description: Format for extra information about a culture when it's the selected culture.
#  {0} - string | System culture code (en-US, etc)
CultureInfoFormatSelected: <#0f0>已选择</color> <#444>|</color> {0}

# Description: Format for extra information about a time zone when it's the selected time zone.
#  {0} - string | System time zone code (America/New_York, etc)
#  {1} - DateTime (Format: "t")
TimeZoneInfoFormatSelected: <#0f0>已选择</color> <#444>|</color> {0} <#444>|</color> <#fff>{1}

# Description: Title of the contributors section of a language.
LanguageContributorsTitle: 贡献者

# Description: Description of what cultures are used for.
CultureDescription: 所选择的国际区域设置会影响数字、日期、百分比以及其他区域相关文本的显示方式。如果选择“使用区域设置处理命令输入”，你的命令输入将根据你的区域设置进行解析。例如：小数点使用逗号而不是句号，月份和日期顺序会正确调整等。

# Description: Label for the Show Enemy Cosmetics option.
EnemyCosmeticsOptionLabel: 显示敌方外观

# Description: Label for the Show Friendly Cosmetics option.
FriendlyCosmeticsOptionLabel: 显示友方外观

# Description: Description of what the Show Cosmetics options do.
CosmeticsDescription: 如果关闭玩家外观显示，你将只能看到他们队伍的制服。精英套装或自定义装备中的服装将不会显示。此选项不影响原版皮肤或神话级外观，它们始终会被隐藏。

# Description: Label for the IMGUI Mode option.
IMGUIOptionLabel: IMGUI 模式

# Description: Description of what the IMGUI Mode option does.
IMGUIDescription: 启用 <smallcaps>-Glazier IMGUI</smallcaps> 启动选项的聊天支持，该选项会恢复旧版 UI 系统。一些玩家为了提升性能，或者显示 uGUI（默认 UI 选项）不支持的部分字符，会选择使用此启动方式。

# Description: Label for the Track Daily Missions option.
TrackQuestsOptionLabel: 跟踪每日任务

# Description: Description of what the Track Daily Missions option does.
TrackQuestsDescription: 默认情况下，每日任务会在你加入游戏时自动添加到任务菜单中。关闭此选项后，它们将不会自动添加。你的任务进度仍会继续记录，并且你可以随时在原版任务菜单中手动“跟踪”它们。