# Description: Sent when a command is not used correctly.
#  {0} - string | Command usage.
CorrectUsage: <#ff8c69>正确用法为：{0}。

# Description: A command or feature hasn't been completed or implemented.
NotImplemented: <#ff8c69>此命令尚实装。

# Description: A player ran an unknown command.
UnknownCommand: <#ff8c69>未知命令。<#b3ffb3>输入 <#fff>/help</color> 查看帮助。

# Description: A command or feature can only be used by the server console.
ConsoleOnly: <#ff8c69>此命令只能在服务器控制台执行。

# Description: A command or feature can only be used by a player (instead of the server console).
PlayersOnly: <#ff8c69>此命令无法在服务器控制台执行。

# Description: A command or feature is on cooldown.
#  {0} - Cooldown (Format: Long Time) | Time until available
#  {1} - string | Feature or command name
#  | Addon: Lowercase
CommandCooldown: <#ff8c69>你还需要等待 <#aaa>{0}</color> 才能再次使用 <#fff>{1}</color>。

# Description: A player name or ID search turned up no results.
PlayerNotFound: <#ff8c69>未找到玩家。

# Description: A command didn't respond to an interaction, or a command chose to throw a vague error response to an uncommon problem.
UnknownError: <#ff8c69>执行命令时发生未知错误。

# Description: A vanilla command didn't print a response.
VanillaCommandDidNotRespond: <#d09595>你执行的原版命令没有返回任何结果。

# Description: An async command was cancelled mid-execution.
ErrorCommandCancelled: <#ff8c69>此命令在执行过程中已被取消。这可能是由于游戏结束或程序错误导致的。

# Description: A command is disabled in the current gamemode type (ex, /deploy in a gamemode without FOBs).
GamemodeError: <#ff8c69>当前游戏模式下无法使用此命令。

# Description: The caller of a command is not allowed to use the command.
NoPermissions: <#ff8c69>你没有权限使用此命令。

# Description: The caller of a command is not allowed to use the command.
#  {0} - PermissionLeaf
NoPermissionsSpecific: <#ff8c69>你缺少权限 {0}，无法使用此命令。

# Description: A command or feature is turned off in the configuration or for the current layout.
NotEnabled: <#ff8c69>此功能当前未启用。

# Description: The caller of a command has permission to use the command but isn't on duty.
NotOnDuty: <#ff8c69>你必须值勤后才能执行此命令。

# Description: The value of a parameter was not in a valid time span format.
#  {0} - string (Format: Character Name) | Inputted text.
InvalidTime: <#ff8c69><#d09595>{0}</color> 不是有效的 <#cedcde>时间格式</color>。示例：<#d09595>10d12h</color>、<#d09595>4mo15d12h</color>、<#d09595>2y</color>、<#d09595>permanent</color>。

# Description: A player tried to get help with an unknown command.
UnknownCommandHelp: <#ff8c69>未知命令。<#b3ffb3>输入 <#fff>/help <命令名称></color> 查询命令帮助。

# Description: Sent when a player tries to use a command that requires them to be in main.
NotInMain: <#b3a6a2>你必须位于 <#cedcde>主基地</color> 才能使用此命令。

# Description: Okay button in the popup UI.
PopupOkay: 确定

# Description: Yes button in the popup UI.
PopupYes: 是

# Description: No button in the popup UI.
PopupNo: 否

# Description: Cancel button in the popup UI.
PopupCancel: 取消

# Description: Copy text popup default header.
PopupCopyText: 复制文本