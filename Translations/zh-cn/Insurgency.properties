# Description: Formatting for the name of a cache in the flag list UI for attackers when the cache is discovered.
#  {0} - int
#  {1} - string
FlagListDiscoveredCacheAttack: <#ff7661>武器库 {0}</color>  <#c2c2c2>@ {1}</color>

# Description: Formatting for the name of a cache in the flag list UI for defenders when the cache is discovered.
#  {0} - int
#  {1} - string
FlagListDiscoveredCacheDefend: <#555bcf>武器库 {0}</color>  <#c2c2c2>@ {1}</color>

# Description: Formatting for the name of a cache in the flag list UI for defenders when the cache is undiscovered.
#  {0} - int
#  {1} - string
FlagListUndiscoveredCacheDefend: <#b780d9>武器库 {0}</color>  <#c2c2c2>@ {1}</color>

# Description: Formatting for the name of a cache in the flag list UI for attackers when the cache is undiscovered or hasn't spawned yet.
FlagListUndiscoveredCacheAttack: <#696969>未发现</color>

# Description: Formatting for the name of a cache in the flag list UI for defenders when the cache hasn't spawned yet.
FlagListUncreatedCacheDefend: <#696969>未知</color>

# Description: Formatting for the name of a cache in the flag list UI for attackers when the cache is destroyed.
FlagListDestroyedCacheAttack: <#5a6e5c>已摧毁</color>

# Description: Formatting for the name of a cache in the flag list UI for defenders when the cache is destroyed.
FlagListDestroyedCacheDefend: <#6b5858>已失守</color>

# Description: Shows on the HUD when a cache has been destroyed and the player is on attack.
CacheDestroyedAttack: <#e8d1a7>敌方武器库已被摧毁！

# Description: Shows on the HUD when a cache has been destroyed and the player is on defense.
CacheDestroyedDefense: <#deadad>友方武器库已被摧毁！

# Description: Shows on the HUD when a cache has been discovered and the player is on attack.
#  {0} - string | The closest location name to the cache.
#  | Addon: Uppercase
CacheDiscoveredAttack: <color=#e8d1a7>在 <color=#e3c59a>{0}</color> 附近发现新的武器库</color>

# Description: Shows on the HUD when a cache has been discovered and the player is on defense.
CacheDiscoveredDefense: <#d9b9a7>武器库位置已暴露，保护它

# Description: Shows on the HUD when a new cache spawns and the player is on defense.
CacheSpawnedDefense: <#a8e0a4>新的武器库现已激活

# Description: Toast formatting for when a player helps gather intel for the attacking force.
#  {0} - int
GainIntelToast: +{0} 情报

# Description: Replacement of the ticket UI for the defending team.
#  {0} - int
RemainingCachesTicketUI: 剩余武器库：{0}

# Description: Sent to a player on the points popup after they destroy a cache.
XPToastCacheDestroyed: 武器库已摧毁！

# Description: Sent to a player who discovers a cache through line-of-sight.
XPToastLosDiscoverCache: 你已发现敌方武器库！

# Description: Sent to a player on the points popup after they destroy a friendly cache.
XPToastFriendlyCacheDestroyed: 你摧毁的是友方武器库！

