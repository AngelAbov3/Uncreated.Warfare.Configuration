# Description: Announcement telling people how to request a kit.
AnnouncementKits: <#9da6a6>如果你无法申请兵种，请尝试 <#fff>攻击兵种牌</color> 来申请你想要的兵种。

# Description: Announcement telling people to grab ammo.
