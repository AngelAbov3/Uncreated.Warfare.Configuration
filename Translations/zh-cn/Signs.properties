SignFAQ1Title: <#fa6122>兵种装备

SignFAQ1Question: <#2df332>问：帮助！我该如何装备兵种？

SignFAQ1Answer: <#fa6122>答：查看兵种标牌并<b><#2df332>攻击</color></b>它即可装备。你可能需要先购买该兵种，请确保你拥有足够的积分！

SignFAQ2Title: <#fa6122>小队

SignFAQ2Question: <#2df332>问：帮助！我该如何加入小队？

SignFAQ2Answer: <#fa6122>答：加入<#2df332>小队</color>可以前往总部或主基地与小队 NPC 对话，或者输入 /squads。

SignFAQ3Title: <#fa6122>部署

SignFAQ3Question: <#2df332>问：帮助！我该如何部署到战场？

SignFAQ3Answer: <#fa6122>答：你可以在总部的战略地图中，对显示的<#2df332>地图标记</color>按下<#2df332>F</color>键，部署到友方<#2df332>FOB</color>。

SignFAQ4Title: <#fa6122>载具

SignFAQ4Question: <#2df332>问：帮助！我该如何补充载具弹药和照明弹？

SignFAQ4Answer: <#fa6122>答：从<#2df332>维修站</color>获取一个<#2df332>重型弹药箱</color>，然后将其投掷到载具上。

SignFAQ5Title: <#fa6122>放弃或释放干扰弹

SignFAQ5Question: <#2df332>问：帮助！我倒地后无法放弃，或者航空载具无法释放干扰弹。

SignFAQ5Answer: <#fa6122>答：倒地或需要释放干扰弹时，按下键盘上的<#2df332>/</color>键。如果无法使用，请前往</color>\r\n<#2df332>设置 -> 模组/插件 -> Code Hotkey#3

