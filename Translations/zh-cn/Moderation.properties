# Description: Broadcasted when a permanent mute is applied to a player by something other than a player (like the console or an automated system).
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - MuteType | Type of mute (ex. 'Voice and Text Chat')
MutePermanentSuccessBroadcastNoActor: <#ffcc99><#d8addb>{0}</color> 已被 <b>永久</b> 禁言（{1}）。

# Description: Broadcasted when a non-permanent mute is applied to a player by another player.
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - IPlayer (Format: Colored Player Name) | Admin
#  {2} - TimeSpan | Duration
