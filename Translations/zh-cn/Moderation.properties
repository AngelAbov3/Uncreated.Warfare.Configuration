# Description: Broadcasted when a non-permanent mute is applied to a player by something other than a player (like the console or an automated system).
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - TimeSpan | Duration
#  {2} - MuteType | Type of mute (ex. 'Voice and Text Chat')
MuteSuccessBroadcastNoActor: <#ffcc99><#d8addb>{0}</color> 已被禁言（{2}），持续时间：<#9cffb3>{1}</color>。

# Description: Broadcasted when a player is kicked (removed from the server) by another player.
