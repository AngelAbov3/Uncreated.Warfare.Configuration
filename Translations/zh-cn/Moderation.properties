# Description: Gets sent to a player when their message gets blocked by the chat filter.
#  {0} - string | Section of the message that matched the chat filter.
ChatFilterFeedback: <#ff8c69>聊天过滤器检测到 <#fdfdfd>{0}</color>，因此消息未发送。

# Description: Gets sent to a player when their message gets blocked by the chat filter.
#  {0} - int | Amount of alphanumeric characters in succession.
NameFilterKickMessage: 你的名字中连续的字母或数字字符数量不足（{0}），请修改你的名字后重新加入。

# Description: Gets sent to a player if they're banned when they join.
#  {0} - string | The reason they're banned
#  {1} - TimeSpan (Format: Short Time) | Duration of time they're banned
#  | Addon: Asset Rarity Color
RejectBanned: 你已被封禁 {1}："{0}"。

# Description: Gets sent to a player if they're permanently banned when they join.
#  {0} - string | The reason they're banned
RejectPermanentBanned: 你已被永久封禁："{0}"。

# Description: Gets sent to a player if someone else sharing an IP or HWID is banned when they join.
#  {0} - string | The reason they're banned
#  {1} - TimeSpan (Format: Short Time) | Duration of time they're banned
#  | Addon: Asset Rarity Color
#  {2} - IPlayer (Format: Steam64 ID) | The banned player's Steam64 ID.
#  {3} - IPlayer (Format: Player Name) | The banned player's name.
RejectLinkedBanned: {3} ({2}) 已被IP封禁 {1}："{0}"。

# Description: Gets sent to a player if someone else sharing an IP or HWID is permanently banned when they join.
#  {0} - string | The reason they're banned
#  {1} - IPlayer (Format: Steam64 ID) | The banned player's Steam64 ID.
#  {2} - IPlayer (Format: Player Name) | The banned player's name.
RejectPermanentLinkedBanned: {2} ({1}) 已被永久IP封禁："{0}"。

# Description: Gets sent to a player who is globally banned in a known ban database (like UCS).
#  {0} - string | Name of the global ban system.
#  {1} - DateTime (Format: Relative (Long Time)) | Ban date.
#  | Addon: Asset Rarity Color
#  {2} - uint | Our discord join code.
RejectGloballyBanned: 你已在 {0} 全局封禁系统中被封禁，封禁时间：{1}（封禁编号 {2}）。如需帮助，请加入我们的 Discord (https://uncreated.network/discord)。

# Description: Gets sent to a player if someone else sharing an IP or HWID is banned in a known ban database (like UCS).
#  {0} - string | Name of the global ban system.
#  {1} - DateTime (Format: Relative (Long Time)) | Ban date.
#  | Addon: Asset Rarity Color
#  {2} - ulong | Our discord join code.
#  {3} - string | The banned player's Steam64 ID.
#  {4} - uint | The banned player's name.
RejectGloballyLinkedBanned: {3} ({2}) 已在 {0} 全局封禁系统中被封禁，封禁时间：{1}（封禁编号 {4}）。如需帮助，请加入我们的 Discord (https://uncreated.network/discord)。

# Description: Gets sent to a player when they're kicked.
#  {0} - string | The reason they're kicked
RejectKicked: 你已被踢出服务器，原因："{0}"。

# Description: Tilte of the warning popup that shows when you get warned.
WarnPopupTitle: <color=#ffff00>警告</color>

# Description: Description of the warning popup that shows when you get warned.
#  {0} - IPlayer (Format: ColoredDisplay or Player Name)
#  {1} - string
WarnPopupDescription: <color=#ffff00>{0} 因 <color=#ffffff>{1}</color> 对你发出警告。</color>

# Description: Description of the warning popup that shows when you get warned when it was done by something other than a player (like the console or an automated system).
#  {0} - string
WarnPopupDescriptionNoActor: 你因 "{0}" 被警告。

# Description: Gets sent to a player when their nick name gets blocked by the chat filter.
#  {0} - string | Violating text.
NameProfanityNickNameKickMessage: 你的昵称违反了我们的粗俗内容过滤规则："{0}"。请修改你的名字后重新加入。

# Description: Gets sent to a player when their character name gets blocked by the chat filter.
#  {0} - string | Violating text.
NameProfanityCharacterNameKickMessage: 你的角色名称违反了我们的粗俗内容过滤规则："{0}"。请修改你的名字后重新加入。

# Description: Gets sent to a player when their player name gets blocked by the chat filter.
#  {0} - string | Violating text.
NameProfanityPlayerNameKickMessage: 你的 Steam 名称违反了我们的粗俗内容过滤规则："{0}"。请修改你的名字后重新加入。

# Description: Broadcasted when a permanent ban is applied to a player by another player.
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - IPlayer (Format: ColoredDisplay or Player Name) | Admin
BanPermanentSuccessBroadcast: <#ffcc99><#d8addb>{0}</color> 已被 {1} <b>永久</b> 封禁。

# Description: Broadcasted when a permanent ban is applied to a player by something other than a player (like the console or an automated system).
#  {0} - IPlayer (Format: Character Name) | Offender
BanPermanentSuccessBroadcastNoActor: <#ffcc99><#d8addb>{0}</color> 已被 <b>永久</b> 封禁。

# Description: Broadcasted when a non-permanent ban is applied to a player by another player.
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - IPlayer (Format: Colored Player Name) | Admin
#  {2} - TimeSpan | Duration
