#  {1} - TimeSpan | Duration
BanSuccessBroadcastNoActor: <#ffcc99><#d8addb>{0}</color> 已被封禁 <#9cffb3>{1}</color>。

# Description: Broadcasted when a permanent mute is applied to a player by another player.
#  {0} - IPlayer (Format: Character Name) | Offender
#  {1} - IPlayer (Format: ColoredDisplay or Player Name) | Admin
#  {2} - MuteType | Type of mute (ex. 'Voice and Text Chat')
