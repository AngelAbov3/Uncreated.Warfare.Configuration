# Description: Popup title for the notification that voice chat is being recorded.
VoiceRecordNoticeTitle: 注意

# Description: Popup description for the notification that voice chat is being recorded.
VoiceRecordNoticeDescription: 语音聊天正在被录制，用于服务器管理与审核。录音仅会在工作人员之间保持私密，并且只会在必要情况下保存。如需继续使用语音聊天，请点击下方“接受”按钮。

# Description: Accept button for the notification that voice chat is being recorded.
VoiceRecordNoticeAcceptButton: 接受

# Description: Deny button for the notification that voice chat is being recorded. This button will also mute the player.
VoiceRecordNoticeDenyButton: 拒绝（会导致禁言）