# Description: Displays the distance from the caller's position to their squad's waypoint.
#  {0} - float (Format: "N0") | Distance in meters
RangeOutput: <#9e9c99>你与你的小队标记之间的距离为: <#8aff9f>{0}米</color>。

# Description: Output if there is no waypoint placed.
RangeNoMarker: <#9e9c99>你的小队没有设置标记。

# Description: Output if the player is not the squad leader.
DropMarkerNotSquadleader: <#9e9c99>只有 <#cedcde>小队长</color> 可以放置标记。

# Description: Output if the player is not in a squad.
RangeNotInSquad: <#9e9c99>你必须 <#cedcde>加入小队</color> 才能使用 /range。