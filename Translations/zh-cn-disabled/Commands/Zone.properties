# Description: Send the caller's location and angle.
#  {0} - float (Format: "0.##") | X (m)
#  {1} - float (Format: "0.##") | Y (m)
#  {2} - float (Format: "0.##") | Z (m)
#  {3} - float (Format: "0.##") | Yaw (°)
ZoneUtilLocation: <#e6e3d5>位置: {0}, {1}, {2} | 偏航角: {3}°.

# Description: Response to the caller when they're not in a zone and try to run a zone command.
ZoneNoResultsLocation: <#ff8c69>你不在任何已存在的区域内。

# Description: Response to the caller when they try to run a zone command but their input doesn't match an active zone.
ZoneNoResultsName: <#ff8c69>找不到该名称的区域。

# Description: Response to the caller when they try to run a zone command but their input doesn't match an active zone and they're not in a zone.
ZoneNoResults: <#ff8c69>你必须位于一个区域内，或指定一个有效的区域名称才能使用此命令。

# Description: Sent when a player visualizes a zone's border.
#  {0} - int | Number of border particles spawned
#  {1} - Zone (Format: Name) | Zone name
ZoneVisualizeSuccess: <#e6e3d5>已在 <color=#cedcde>{1}</color> 周围生成 {0} 个边界粒子。