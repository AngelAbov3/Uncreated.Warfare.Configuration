# Description: Kick message for a player that suffers from a rare bug which will cause GameObject.get_transform() to throw a NullReferenceException (not return null). They are kicked if this happens.
#  {0} - string | Discord Join Code
NullTransformKickMessage: 你的角色出现错误，导致区域插件无法正常运行。如果问题持续存在，请重新加入游戏或联系管理员。（discord.gg/{0}）。

# Description: Gets sent to a player who is attempting to main camp the other team.
AntiMainCampWarning: <#fa9e9e>停止<b><#ff3300>蹲守敌方主基地</color></b>！伤害将会<b>反弹</b>到你自己身上。

# Description: Gets sent to a player who is trying to place a non-whitelisted barricade on a vehicle.
#  {0} - ItemBarricadeAsset | Barricade being placed
#  | Addons:
#  |  - Always Plural
#  |  - Asset Rarity Color
NoPlacementOnVehicle: <#fa9e9e>你无法在载具上放置 {0}！</color>

# Description: Generic message sent when a player is placing something in a place they shouldn't.
#  {0} - ItemAsset | Item being placed
#  | Addons:
#  |  - Always Plural
#  |  - Asset Rarity Color
ProhibitedPlacement: <#fa9e9e>你不能在这里放置 {0}。

# Description: Generic message sent when a player is dropping something in a place they shouldn't.
#  {0} - ItemAsset | Item being placed
#  | Addons:
#  |  - Always Plural
#  |  - Asset Rarity Color
ProhibitedItemDrop: <#fa9e9e>你不能在这里丢弃 {0}。

# Description: Sent when a player tries to steal a battery.
NoStealingBatteries: <#fa9e9e>禁止偷取电池。</color>

# Description: Sent when a player tries to manually leave their group.
NoLeavingGroup: <#fa9e9e>你无法手动更换队伍，请使用 <#cedcde>/teams</color>。

# Description: Message sent when a player tries to place a non-whitelisted item in a storage inventory.
#  {0} - ItemAsset | Item being stored
#  | Addons:
#  |  - Always Plural
#  |  - Asset Rarity Color
ProhibitedStoring: <#fa9e9e>你无法储存 {0}。

# Description: Sent when a player tries to point or mark while not a squad leader.
MarkerNotInSquad: <#fa9e9e>只有你的小队成员可以看到标记。使用 <#cedcde>/squad create</color> 创建小队后才能使用此功能。

# Description: Sent on a SEVERE toast when the player enters enemy territory.
#  {0} - string | Seconds until death
EnteredEnemyTerritory: 敌方总部附近\n立即离开\n将在 <uppercase>{0}</uppercase> 后死亡

# Description: Sent 2 times before a player is kicked for inactivity.
#  {0} - string | Time code
InactivityWarning: <#fa9e9e>如果你不移动，将在 <#cedcde>{0}</color> 后因挂机被踢出。</color>

# Description: Sent when an unauthorized player attempts to edit a sign.
ProhibitedSignEditing: <#ff8c69>你无权编辑该标牌。

# Description: Sent when a player tries to craft a blacklisted blueprint.
NoCraftingBlueprint: <#b3a6a2>该物品禁止制作。

# Description: Shows above the XP UI when divisions are enabled.
#  {0} - Branch | Branch (Division) the player is a part of.
XPUIDivision: {0} 部队

# Description: Tells the player that the game detected they have started nitro boosting.
StartedNitroBoosting: <#e00ec9>感谢你的 Nitro 助力！游戏内特权已激活。

# Description: Tells the player that the game detected they have stopped nitro boosting.
StoppedNitroBoosting: <#9b59b6>你的 Nitro 助力已过期。游戏内特权已停用。

# Description: Tells the player that they can't remove clothes which have item storage.
NoRemovingClothing: <#b3a6a2>你无法脱下兵种装备中带有储物功能的服装。

# Description: Tells the player that they can't unlock vehicles from the vehicle bay.
UnlockVehicleNotAllowed: <#b3a6a2>你无法解锁已请求的载具。

# Description: Goes on the warning UI.
MortarWarning: 敌方迫击炮\n来袭

# Description: Sent on the injure UI.
InjuredUIHeader: 你已受伤

# Description: Sent on the injure UI telling the player how to give up
InjuredUIGiveUp: 按下 <color=#cecece><b><plugin_2/></b></color> 放弃。

# Description: Sent in chat to tell the player how to give up.
InjuredUIGiveUpChat: <#ff8c69>你已受伤，按下 <color=#cedcde><plugin_2/></color> 放弃。

# Description: Sent when a player tries to heal an injured player when they're not a medic.
