# Description: Indicates that a buildable can only be placed within a FOB's active radius.
BuildNotInRadius: <#ffab87>只能在 <#cedcde>FOB 范围</color> 内放置。

# Description: Indicates that a buildable that is being shoveled can is no longer within a FOB's active radius.
BuildTickNotInRadius: <#ffab87>附近已没有友方 FOB。

# Description: Indicates that a buildable can only be placed within a FOB's active radius, which is currently reduced because it doesn't have a bunker.
#  {0} - float (Format: "N0") | Maximum radius
BuildSmallRadius: <#ffab87>当前只能在距离此 FOB 电台 {0} 米范围内放置。建造 <#cedcde>FOB 掩体</color> 可扩大该范围。

# Description: Sent to the player when they try to take a supply crate from a trunk.
CantTakeSupplyCrate: <#ffab87>请直接将补给箱从后备箱卸下，以补充 FOB 补给。

# Description: Indicates that the maximum amount of buildables of the given type have already been built on this FOB.
#  {0} - int (Format: "F0") | Maximum amount
#  {1} - ShovelableInfo | Buildable type
#  | Addon: Plural if {0} ≠ 1.
BuildLimitReached: <#ffab87>在此 FOB 已建造 {0} 个 {1}。

# Description: Indicates that the maximum amount of buildables of the given type have already been built in the general area.
#  {0} - int (Format: "F0") | Maximum amount
#  {1} - ShovelableInfo | Buildable type
#  | Addon: Plural if {0} ≠ 1.
RegionalBuildLimitReached: <#ffab87>此区域最多只能建造 {0} 个 {1}。

# Description: Indicates that the maximum amount of buildables of the given type have already been built on this FOB while digging out a new building.
#  {0} - ShovelableInfo | Buildable type
#  | Addon: Always Plural
BuildTickStructureExists: <#ffab87>此 FOB 内已建造过多 {0}。

# Description: Indicates that a buildable can only be placed within a friendly FOB.
BuildEnemy: <#ffab87>不能在敌方 FOB 内建造。

# Description: Indicates that a player cannot shovel up an enemy fob, emplacement or fortification.
ShovelableNotFriendly: <#ffab87>你无法拆除敌方工事。

# Description: Indicates that a buildable needs more building supplies to be built.
#  {0} - float | Progress shovel hits
#  {1} - float | Required shovel hits
BuildMissingSupplies: <#ffab87>附近缺少建造物资！<#f3ce82>建造进度：<#e0d8b8>{0}/{1}</color></color>。

# Description: Indicates that a buildable can only be placed nearby a supply crate.
BuildFOBNoSupplyCrate: <#ffab87>建造 FOB 时必须位于友方 <#cedcde>补给箱</color> 附近。

# Description: Indicates that a FOB can't be placed in a weird position, like on a vehicle.
BuildFOBInvalidPosition: <#ffab87>无法在此处建造 FOB。

# Description: Indicates that a FOB buildable can't be placed in a weird position, like on a vehicle.
BuildFOBBuildableInvalidPosition: <#ffab87>无法在此处建造该设施。

# Description: Indicates that no more FOBs can be built because the maximum amount has been reached.
BuildMaxFOBsHit: <#ffab87>你的队伍已达到 FOB 数量上限。

# Description: Indicates that FOBs can not be built underwater.
BuildFOBUnderwater: <#ffab87>无法在水下建造 FOB。

# Description: Indicates that FOBs can not be built this high above the terrain.
#  {0} - float (Format: "F0") | Maximum distance (in meters) above terrain
BuildFOBTooHigh: <#ffab87>FOB 不能建造在高于地面 {0} 米的位置。

# Description: Indicates that FOBs can not be built this close to a main base.
BuildFOBTooCloseToMain: <#ffab87>不能在距离主基地这么近的位置建造 FOB。

# Description: Indicates that FOBs can only be built near friendly ground/air logistics vehicle.
BuildNoLogisticsVehicle: <#ffab87>放置 FOB 电台时必须位于友方 <#cedcde>后勤载具</color> 附近。

# Description: Indicates that a FOB can't be built because another FOB is already nearby.
#  {0} - IFob (Format: Colored Name) | The existing FOB's name
#  {1} - float (Format: "F0") | Distance from the existing FOB
#  {2} - float (Format: "F0") | Minimum distance needed
BuildFOBTooClose: <#ffa238>距离现有 FOB 过近（{0}：{1} 米）。至少需要距离 {2} 米才能放置新的 FOB。

# Description: Indicates that a FOB can't be built because another FOB bunker is already nearby.
#  {0} - float (Format: "F0") | Distance from the existing bunker
#  {1} - float (Format: "F0") | Minimum distance needed
BuildBunkerTooClose: <#ffa238>距离现有 FOB 掩体过近（{0} 米）。至少需要距离 {1} 米才能放置新的电台。

# Description: Indicates that a player doesn't have permissions or is missing the required kit, etc. to place a buildable.
BuildableNotAllowed: <#ffa238>你无法放置该建筑。

# Description: Indicates that a player isn't able to place traps in a FOB.
TrapNotAllowed: <#ffa238>陷阱不能放置在距离 FOB 如此近的位置。

# Description: Indicates that a player cannot place a rally point because there are enemies nearby.
PlaceRallyPointNearbyEnemies: <#ffaa42>无法放置集结点——附近有敌人。

# Description: Indicates that a player cannot place a rally point because of environmental restrictions.
PlaceRallyPointInvalid: <#ffaa42>无法在此处放置集结点。

# Description: The title/header of the FOB list UI.
FobListTitle: FOB 列表