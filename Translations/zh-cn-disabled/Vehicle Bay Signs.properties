# Description: Displays the ticket cost on a vehicle bay sign.
#  {0} - int
VBSTickets: <#ffffff>{0}</color> <#f0f0f0>兵票</color>

# Description: Displays the state of the sign when the vehicle is ready to be requested.
VBSStateReady: <#33cc33>可用!</color> <#aaa><b>/request</b></color>

# Description: Displays the state of the sign when the vehicle was left idle on the field.
#  {0} - TimeSpan (Format: MM:SS) | Minutes
#  | Addon: Asset Rarity Color
VBSStateIdle: <#ffcc00>在战场中被抛弃: {0}</color>后自动重生

# Description: Displays the state of the sign when the vehicle spawner is currently delayed by the current layout.
#  {0} - TimeSpan (Format: MM:SS)
#  | Addon: Asset Rarity Color
VBSStateLayoutDelayed: <#7094dd>在延迟: {0}</color>后可用

# Description: Displays the state of the sign when the vehicle spawner is disabled in the current layout.
VBSStateLayoutDisabled: <#798082>已在当前模式禁用</color>

# Description: Displays the state of the sign when the vehicle spawner is has been disposed and is no longer useable.
VBSStateDisposed: <#798082>已停用</color>

# Description: Displays the state of the sign when the vehicle was gliched when it tried to spawn.
VBSStateGlitched: <#ff0000>错误</color>