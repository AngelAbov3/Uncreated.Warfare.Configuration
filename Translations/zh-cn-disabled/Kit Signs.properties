# Description: Shown on a kit sign when a kit is available without purchase (in-game or monetary).
KitFree: <#66ffcc>免费</color>

# Description: Shown on a kit sign when a kit is unable to be given access through normal means. Usually this is for event kits.
KitExclusive: <#96ffb2>活动专属</color>

# Description: Shown on a kit sign when a kit requires nitro boosting and the person looking at the sign is boosting.
KitNitroBoostOwned: <#f66fe6>服务器助力礼包</color>

# Description: Shown on a kit sign when a kit requires nitro boosting and the person looking at the sign is not boosting.
KitNitroBoostNotOwned: <#9b59b6>需要启用服务器NITRO助力</color>

# Description: Shown on a kit sign when the player has purchased the kit (with credits).
KitPublicOwned: <#769fb5>已解锁</color>

# Description: Shown on a kit sign when the player has purchased the kit (with real money).
KitPremiumOwned: <#769fb5>已购买</color>

# Description: Shown on an unused loadout sign.
#  {0} - int | The number of the loadout sign.
LoadoutNumber: <b><#7878ff>配置 #{0}</color></b>

# Description: Shown on a used loadout sign so players can see what loadout letter each kit is.
#  {0} - string | The letter of the loadout sign.
#  | Addon: Uppercase
LoadoutLetter: <sub><#7878ff>配置 {0}</color></sub>

# Description: Shown on a kit sign when the player is already using this kit.
KitCurrentlyUsing: <#827d6d>已选择</color>

# Description: Shown on a kit sign when the kit can only be requested by a squad leader and the player isn't one.
KitRequiresSquadLeader: <#a69870>仅限小队长使用</color>

# Description: Shown on a kit sign when the kit can only be requested by players in a squad and the player isn't one.
KitRequiresJoinSquad: <#a69870>加入小队</color>

# Description: Shown on a kit sign when there are already too many people using this kit class in the player's squad.
KitAlreadyTakenBySquadMember: <#c2603e>被他人使用中</color>

# Description: Shown on a kit sign when there needs to be a certain amount of players in their squad to use the kit.
#  {0} - int
#  {1} - int
KitNotEnoughPlayersInSquad: <#c2846e>需小队内达到: {0}/{1}</color>才能使用这个装备

# Description: Shown on a kit sign when there are too many players in the player's squad using this kit type.
#  {0} - int
#  {1} - int
KitTeamClassLimitReached: <#c2846e>队伍中: {0}/{1}</color>人已经在使用这个装备了

# Description: Shown on a kit sign when a kit can be requested.
KitAvailable: <#96ffb2>可用</color>

# Description: Shown on a loadout or kit sign when it's locked by the admins while it's being worked on.
KitLoadoutSetup: <#3399ff>正在等待装配</color>