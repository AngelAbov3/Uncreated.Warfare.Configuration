# Description: Sent as a warning before daily quests regenerate. Usually one is sent 1 hour before and 10 minutes before they regenerate.
#  {0} - TimeSpan (Format: Long Time)
#  | Addon: Asset Rarity Color
DailyQuestNextDayWarning: <#99bacc>每日任务将在 <#eef4f6>{0}</color> 后过期。

# Description: Sent when new daily quests are generated.
DailyQuestNextDay: <#99bacc>每日任务已刷新。

# Description: Sent when a quest is updated, example the player got a kill.
#  {0} - string
QuestUpdated: <#99bacc>任务更新：<#eef4f6>{0}</color>。

# Description: Sent when a quest is completed.
#  {0} - string
QuestCompleted: <#99bacc>任务完成：<#eef4f6>{0}</color>。