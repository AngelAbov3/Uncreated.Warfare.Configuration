# Description: Permanent time, lasts forever.
TimePermanent: 永久

# Description: 1 second (singular).
TimeSecondSingle: 秒

# Description: X seconds (plural).
TimeSecondPlural: 秒

# Description: 1 minute (singular).
TimeMinuteSingle: 分钟

# Description: X minutes (plural).
TimeMinutePlural: 分钟

# Description: 1 hour (singular).
TimeHourSingle: 小时

# Description: X hours (plural).
TimeHourPlural: 小时

# Description: 1 day (singular).
TimeDaySingle: 天

# Description: X days (plural).
TimeDayPlural: 天

# Description: 1 week (singular).
TimeWeekSingle: 周

# Description: X weeks (plural).
TimeWeekPlural: 周

# Description: 1 month (singular).
TimeMonthSingle: 月

# Description: X months (plural).
TimeMonthPlural: 月

# Description: 1 year (singular).
TimeYearSingle: 年

# Description: X years (plural).
TimeYearPlural: 年

# Description: Joining keyword (1 hour "and" 30 minutes).
TimeAnd: ，

# Description: Relative time in future prefix ("in" 1 hour).
RelativeTimeFuturePrefix: 在

# Description: Relative time in future suffix (in 1 hour ""). Unused in English.
RelativeTimeFutureSuffix

# Description: Relative time in past prefix ("" 1 hour ago). Unused in English.
RelativeTimePastPrefix

# Description: Relative time in past suffix (1 hour "ago").
RelativeTimePastSuffix: 前

# Description: Relative time when time is almost equal to now.
RelativeTimeNow: 现在