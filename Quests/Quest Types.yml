    # Kill streak
  - Type: Uncreated.Warfare.Quests.Templates.KillStreak
    Name: Kill Streak
    Text:
      en-us: "Get <b><color=#808080>{0}/{1}</color></b> <color=#ff704d>{2}</color>-kill streaks without dying."
    CanBeDailyQuest: true
    Properties:
      StreakCount: "$(4:8)"   # strNum
      StreakLength: "$(3:5)" # strLen
    Rewards:
      - Type: XPReward
        Expression: "strNum*(strLen^2)"
      - Type: CreditsReward
        Expression: "Ceil(0.4*strNum*(strLen^2))"
      
