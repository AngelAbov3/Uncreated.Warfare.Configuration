    # Kill enemies in range
  - Type: Uncreated.Warfare.Quests.Templates.KillEnemies
    Name: Kill Enemies in Range
    Text:
      en-us: "Kill <b><color=#00ace6>{0}/{1}</color></b> enemies from more than <color=#999999>{2}m</color> away."
    CanBeDailyQuest: true
    Properties:
      Kills: "$(10:35){5}"   # k
      Range: "$(50:350){25}" # d
    Rewards:
      - Type: XPReward
        Expression: "((d+50)/100)*4*k"
      - Type: CreditsReward
        Expression: "((d+50)/100)*k"

    # Kill enemies with weapon
  - Type: Uncreated.Warfare.Quests.Templates.KillEnemies
    Name: Kill Enemies with Weapon
    Text:
      en-us: "Kill <b><color=#00ace6>{0}/{1}</color></b> enemies with the {3}."
    Properties:
      Kills: "$(10:35){5}" # k
      Weapons: "$*"
    Rewards:
      - Type: XPReward
        Expression: "((d+50)/100)*4*k"
      - Type: CreditsReward
        Expression: "((d+50)/100)*k"
    Presets:
      - Key: 97607e5c-65c9-48f9-ad49-6fa2c9862409
        Flag: 61002
        State:
